# =============================================================================
# Dev profile — local development overrides.
# Activated by SPRING_PROFILES_ACTIVE=dev (also the default per application.yaml).
#
# Defaults here assume:
#   - Backing services running via Infras_Devops/docker-buildlocal.yml
#   - override sensitive values (mail password, AI keys) via VS Code launch.json env or an .env file you do NOT commit.
# =============================================================================
spring:
  devtools:
    restart:
      # Migrations must be complete before a deliberate application restart;
      # otherwise Flyway can apply a file while an agent is still editing it.
      additional-exclude: db/migration/**
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pji_dev}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin2026}

# Make local upload/download point at the local MinIO container directly
integration:
  minio:
    url: ${INTEGRATION_MINIO_URL:http://localhost:9000}
    public-url: ${INTEGRATION_MINIO_PUBLIC_URL:http://localhost:9000}
    access-key: ${INTEGRATION_MINIO_ACCESS_KEY:admin}
    secret-key: ${INTEGRATION_MINIO_SECRET_KEY:admin2026}

secure:
  cookie:
    secure: false
  jwt:
    # Dev-only defaults. Safe to commit because they are only used when
    # SPRING_PROFILES_ACTIVE=dev. Each must base64-decode to at least 64 bytes,
    # which HS512 requires (JwtConfiguration.getSecretKey enforces it).
    # Override via env in prod; application.yaml intentionally has no default.
    access-base64-secret: ${JWT_ACCESS_BASE64_SECRET:4rTMB2llWCFXZsKLqkMelqfnXLv1AQp/+GfzArfXGQOTMHE4LmWZgGoWlHWIpXraI8ZV8cmPVX8jEz1vs7ZpJw==}
    refresh-base64-secret: ${JWT_REFRESH_BASE64_SECRET:Pke9t1QeHtR+ylNYxQqLv5B5njRbdFMzQKaaUUZtf6F+E7Ogweoxx8+frg38QYRl/nNdKthahax6hNN6TIVyLw==}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,http://localhost:5173}
  upload-session:
    public-web-url: ${UPLOAD_SESSION_PUBLIC_WEB_URL:http://localhost:5173}

ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

extract-images:
  base-url: ${EXTRACT_IMAGES_URL:http://localhost:8002}

# Swagger ON in dev, OFF in prod
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false   # avoid SMTP probe failing dev startup

logging:
  level:
    com.vietnam.pji: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
